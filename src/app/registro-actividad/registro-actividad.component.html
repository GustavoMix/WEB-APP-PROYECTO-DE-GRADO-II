<section class="actividad-page">
  <div class="page-hero">
    <div class="page-hero-inner">
      <h1>Registro de Actividad</h1>
      <p>Historial real de registros y objetos recuperados en este dispositivo.</p>
    </div>
  </div>

  <div class="page-container">
    <div class="toolbar">
      <select class="form-control" [(ngModel)]="limite" (ngModelChange)="cargar()">
        <option [ngValue]="10">Mostrar 10 actividades</option>
        <option [ngValue]="20">Mostrar 20 actividades</option>
        <option [ngValue]="50">Mostrar 50 actividades</option>
      </select>
    </div>

    <div class="table-card" *ngIf="actividades.length; else vacio">
      <table class="table">
        <thead>
          <tr>
            <th>Acción</th>
            <th>Detalle</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let a of actividades">
            <td>{{a.accion}}</td>
            <td>{{a.detalle}}</td>
            <td>{{a.fecha | date:'dd/MM/yyyy HH:mm'}}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #vacio>
      <div class="empty-card">
        Todavía no hay actividad registrada en este dispositivo. Registra o recupera un objeto para verlo aquí.
      </div>
    </ng-template>
  </div>
</section>
